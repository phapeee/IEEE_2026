settings:
  requester: game_director
  tick_period_sec: 0.5
  boot_wait_sec: 15.0
  stale_robot_timeout_sec: 2.5
  min_battery_soc: 0.2
  major_inflight_limit_per_robot: 1
  micro_inflight_limit_per_robot: 1
  failure_degrade_threshold: 3
  match_duration_sec: 600.0
  queued_timeout_default_sec: 30.0
  running_timeout_default_sec: 120.0
  api_response_timeout_sec: 8.0
  cancel_retry_period_sec: 5.0
  cancel_timeout_sec: 45.0

world:
  antennas:
    A1: UNKNOWN
    A2: UNKNOWN
    A3: UNKNOWN
    A4: UNKNOWN
  ducks: [D1, D2, D3, D4, D5]
  crater_pair: [bot_button, bot_keypad]
  drop_zone: drop_zone
  # expected_ground_robots: [bot_button, bot_keypad, bot_rotary, bot_crater]
  expected_ground_robots: [bot_button]
  # expected_drone_robots: [drone1]
  expected_drone_robots: []

tasks:
  - id: activate_antenna_a1
    type: ACTIVATE_ANTENNA
    phase: GAME_START
    target:
      antenna_id: A1
      staging_waypoint: antenna_button
    preconditions:
      - kind: robot_online
        robot: bot_button
    dismiss_conditions:
      - kind: antenna_state_in
        antenna_id: A1
        states: [ACTIVATED, ATTEMPTED_FAILED]
    success_conditions:
      - kind: antenna_state_in
        antenna_id: A1
        states: [ACTIVATED]
    lock_keys: ['antenna:A1']
    priority:
      base: 200.0
      deadline_boost_per_sec: 0.001
    retry:
      max_attempts: 3
      backoff_sec: 3.0
    timeouts:
      queued_sec: 20.0
      running_sec: 45.0
    preferred_robots: [bot_button]
    dispatch:
      mode: robot_targeted
      fleet: ground
      robot: bot_button
      request:
        category: compose
        description:
          category: activate_antenna
          phases:
            - activity:
                category: sequence
                description:
                  activities:
                    - category: perform_action
                      description:
                        unix_millis_action_duration_estimate: 10000
                        category: activate_antenna
                        description:
                          antenna_id: "{{antenna_id}}"
                          duration_sec: 4.0


