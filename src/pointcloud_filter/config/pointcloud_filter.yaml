pointcloud_filter:
  ros__parameters:
    target_frame: base_link
    cloud_in1_topic: left_depth_pcl
    cloud_in2_topic: right_depth_pcl
    output_topic: filtered_point
    output_pointcloud_topic: debug/pointcloud_filter/output_cloud
    debug_output: false
    debug_topic_prefix: debug/pointcloud_filter
    min_height: -0.2
    max_height: 0.5
    min_range: 0.1
    max_range: 2.0
    cluster_tolerance: 0.2
    min_cluster_size: 5
    center_method: average
    denoise_enabled: true
    noise_radius: 0.1
    noise_min_neighbors: 2
    sync_timeout: 0.25
    process_rate: 10.0
