# nav2_params.yaml
#
# For use with:
#   ros2 launch nav2_bringup navigation_launch.py \
#       params_file:=/path/to/nav2_params.yaml \
#       use_sim_time:=false \
#       autostart:=true

########################################
# Controller Server (local planner)
########################################
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.03
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker (tolerance when “at goal”)
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.01
      stateful: true

    # Local controller plugin (Regulated Pure Pursuit)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # Holonomic kinematics
      min_vel_x: -0.3
      max_vel_x: 0.3
      min_vel_y: -0.3
      max_vel_y: 0.3
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0

      # Acceleration limits
      acc_lim_x: 0.2
      acc_lim_y: 0.2
      acc_lim_theta: 0.1
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -2.0

      # Sampling / sim time
      vx_samples: 20
      vy_samples: 20
      vtheta_samples: 10
      sim_time: 0.5
      linear_granularity: 0.02
      angular_granularity: 0.12
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true

      # Critic configuration
      # critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      critics: ["Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.2
      PathAlign.scale: 32.0
      GoalAlign.scale: 12.0
      PathDist.scale: 32.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 0.5
      RotateToGoal.slowing_factor: 10.0
      RotateToGoal.lookahead_time: -1.0

########################################
# Planner Server (global planner)
########################################
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]

    # Global planner plugin (Smac 2D)
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0
      motion_model_for_search: "Omni"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      min_turning_radius: 0.0
      cost_penalty: 1.3
      inflation_epsilon: 3.0
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown_validity: true

########################################
# Smoother Server
########################################
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["SimpleSmoother"]

    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

########################################
# Behavior (Recovery) Server
########################################
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    behaviors: ["backup", "spin", "wait", "assisted_teleop"]
    plugin_lib_names:
      - "nav2_behaviors/BackUp"
      - "nav2_behaviors/Spin"
      - "nav2_behaviors/Wait"
      - "nav2_behaviors/AssistedTeleop"

    backup:
      plugin: "nav2_behaviors/BackUp"
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

########################################
# BT Navigator
########################################
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_frame: odom
    transform_tolerance: 0.2
    auto_shutdown: false

    # Default behavior trees from nav2_bt_navigator
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

    # Error code list (Humble+)
    error_code_id_names:
      - "NONE"
      - "TF Error"
      - "Invalid Path"
      - "Patience Exceeded"
      - "Failed To Make Progress"
      - "No Valid Control"

########################################
# Waypoint Follower
########################################
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 1

########################################
# Velocity Smoother (optional but recommended)
########################################
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0

    # Input/output topics
    odom_topic: "/odom"
    robot_cmd_vel_topic: "/cmd_vel_raw"
    smoothed_cmd_vel_topic: "/cmd_vel"

    # Robot limits (tune to your base!)
    max_velocity: [0.5, 0.5, 1.5]        # [vx, vy, wz]
    min_velocity: [0.0, 0.0, 0.0]
    max_accel:    [0.5, 0.5, 2.0]
    max_decel:    [-0.5, -0.5, -2.0]
    deadband_velocity: [0.01, 0.01, 0.05]
    velocity_timeout: 0.1

########################################
# Global Costmap
########################################
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0

      # Size / resolution (tune to your map!)
      width: 2.4384
      height: 1.2192
      resolution: 0.01
      rolling_window: false

      footprint: [[0.1397, 0.1397], [0.1397, -0.1397], [-0.1397, -0.1397], [-0.1397, 0.1397]]
      footprint_padding: 0.01

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.20
        cost_scaling_factor: 4.0

########################################
# Local Costmap
########################################
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      update_frequency: 5.0
      publish_frequency: 5.0

      # Local window around the robot
      width: 1.0
      height: 1.0
      resolution: 0.01
      rolling_window: true

      # Use detailed polygon footprint locally
      footprint: [[0.1397, 0.1397], [0.1397, -0.1397], [-0.1397, -0.1397], [-0.1397, 0.1397]]
      footprint_padding: 0.01

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.20
        cost_scaling_factor: 3.0

########################################
# Lifecycle Manager
########################################
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 0.0
    attempt_respawn_reconnection: true
    node_names:
      - "controller_server"
      - "smoother_server"
      - "planner_server"
      - "behavior_server"
      - "bt_navigator"
      - "waypoint_follower"
      - "velocity_smoother"
