waypoint_state_machine:
  ros__parameters:
    button_state_topic: "smacc2/start_switch_state"
    navigate_action_name: "navigate_to_pose"
    waypoint_angles_in_degrees: true
    mission_file: "/ws/config/mission.yaml"
    task_file: "/ws/config/tasks.yaml"

    # keep the rest of your scalar params the same:
    controller_manager_service: "/controller_manager/switch_controller"
    configure_controller_service: "/controller_manager/configure_controller"
    reset_controller_name: "mecanum_controller"
    reset_pose_service: "/set_pose"
    reset_pose_frame_id: "map"
    reset_pose_x: 0.1778
    reset_pose_y: 0.1778
    reset_pose_yaw: 90.0          # interpreted as deg if waypoint_angles_in_degrees=true
    controller_switch_timeout_sec: 2.0
    reset_pose_timeout_sec: 2.0
    service_wait_timeout_sec: 2.0
    imu_calibration_service: "/trigger_imu_calibration"
    imu_calibration_service_wait_sec: 2.0

