# nav2_params.yaml
#
# For use with:
#   ros2 launch nav2_bringup navigation_launch.py \
#       params_file:=/path/to/nav2_params.yaml \
#       use_sim_time:=false \
#       autostart:=true

########################################
# Controller Server (local planner)
########################################
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker (tolerance when “at goal”)
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      stateful: true

    # Local controller plugin (Regulated Pure Pursuit)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      debug_trajectory_details: false

      # Robot kinematics (diff drive / mecanum-style)
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5

      transform_tolerance: 0.2
      rotate_to_heading_angular_vel: 1.0
      use_rotate_to_heading: true
      allow_reversing: false
      use_interpolation: true

      # Robot speed limits (tune!)
      max_linear_accel: 0.5
      max_linear_decel: 0.5
      max_angular_accel: 2.0
      max_angular_decel: 2.0
      max_linear_vel: 0.5
      min_linear_vel: 0.05
      max_angular_vel: 1.5
      min_angular_vel: 0.2

      # Collision / curvature regulation
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 3.0
      cost_scaling_dist: 0.6
      curvature_scalar: 1.0
      use_rotate_to_heading_for_intermediate_goals: true

########################################
# Planner Server (global planner)
########################################
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]

    # Global planner plugin (Smac 2D)
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0
      motion_model_for_search: "Dubin"   # good default; change if omni
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      min_turning_radius: 0.0
      cost_penalty: 1.3
      inflation_epsilon: 3.0
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown_validity: true

########################################
# Smoother Server
########################################
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["SimpleSmoother"]

    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

########################################
# Behavior (Recovery) Server
########################################
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    behaviors: ["backup", "spin", "wait", "assisted_teleop"]
    plugin_lib_names:
      - "nav2_behaviors::BackUp"
      - "nav2_behaviors::Spin"
      - "nav2_behaviors::Wait"
      - "nav2_behaviors::AssistedTeleop"

    backup:
      plugin: "nav2_behaviors::BackUp"
    spin:
      plugin: "nav2_behaviors::Spin"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

########################################
# BT Navigator
########################################
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_frame: odom
    transform_tolerance: 0.2
    auto_shutdown: false

    # Default behavior trees from nav2_bt_navigator
    default_nav_to_pose_bt_xml: "navigate_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery.xml"

    # Error code list (Humble+)
    error_code_id_names:
      - "NONE"
      - "TF Error"
      - "Invalid Path"
      - "Patience Exceeded"
      - "Failed To Make Progress"
      - "No Valid Control"

########################################
# Waypoint Follower
########################################
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 1.0

########################################
# Velocity Smoother (optional but recommended)
########################################
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0

    # Input/output topics
    odom_topic: "/odom"
    robot_cmd_vel_topic: "/cmd_vel_raw"
    smoothed_cmd_vel_topic: "/cmd_vel"

    # Robot limits (tune to your base!)
    max_velocity: [0.5, 0.0, 1.5]        # [vx, vy, wz]
    min_velocity: [0.0, 0.0, 0.0]
    max_accel:    [0.5, 0.0, 2.0]
    max_decel:    [-0.5, 0.0, -2.0]
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 0.1

########################################
# Global Costmap
########################################
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0

      # Size / resolution (tune to your map!)
      width: 20.0
      height: 20.0
      resolution: 0.05
      rolling_window: false

      # Choose either robot_radius OR footprint (not both)
      robot_radius: 0.25

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_range: 5.0
          raytrace_range: 6.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

########################################
# Local Costmap
########################################
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      update_frequency: 10.0
      publish_frequency: 5.0

      # Local window around the robot
      width: 4.0
      height: 4.0
      resolution: 0.05
      rolling_window: true

      # Use detailed polygon footprint locally
      footprint: [[0.25, 0.20], [0.25, -0.20], [-0.25, -0.20], [-0.25, 0.20]]
      footprint_padding: 0.02

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_range: 4.0
          raytrace_range: 5.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

########################################
# Lifecycle Manager
########################################
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 0.0
    attempt_respawn_reconnection: true
    node_names:
      - "controller_server"
      - "smoother_server"
      - "planner_server"
      - "behavior_server"
      - "bt_navigator"
      - "waypoint_follower"
      - "velocity_smoother"
