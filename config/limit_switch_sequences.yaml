        velocity_x: 0.0
        velocity_y: 0.02
        success_condition: left_pressed
        next_successive_state: set_pose
        timeout_sec: 5.0
        next_timeout_state: failure_termination

      - name: set_pose
        type: set_pose
        pose:
          frame_id: "map"
          x: 0.809625
          y: 0.1651
          yaw_deg: -90.0
          covariance_diagonal: [0.0001, 0.0001, 0.0001]
        next_successive_state: success_termination
        next_failure_state: failure_termination

