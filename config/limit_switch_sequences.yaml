state_machines:
  antenna_button_cali:
    description: "Calibrate xy position before button antenna."
    steps:
      - name: left_wall
        type: move
        velocity_x: 0.0
        velocity_y: 0.02
        success_condition: left_pressed
        next_successive_state: front_wall
        timeout_sec: 5.0
        next_timeout_state: failure_termination

      - name: front_wall
        type: move
        velocity_x: 0.02
        velocity_y: 0.0
        success_condition: front_pressed
        next_successive_state: set_pose
        timeout_sec: 5.0
        next_timeout_state: failure_termination

      - name: set_pose
        type: set_pose
        pose:
          frame_id: "map"
          x: 0.1651
          y: 0.8636
          yaw_deg: 90.0
          covariance_diagonal: [0.0001, 0.0001, 0.0001]
        next_successive_state: success_termination
        next_failure_state: failure_termination

      - name: failure_termination
        type: terminate
        success: false
        message: "antenna_button_cali failed"

      - name: success_termination
        type: terminate
        success: true
        message: "antenna_button_cali complete"

  antenna_keypad_cali:
    description: "Calibrate xy position before keypad antenna."
    steps:
      - name: front_wall
        type: move
        velocity_x: 0.02
        velocity_y: 0.0
