components:
  cmd_vel_relay:
    enabled: false
    name: cmd_vel_relay
    ros__parameters:
      input_topic: "/cmd_vel"
      output_topic: "/mecanum_controller/reference"
      frame_id: "base_link"
      
  controller_manager:
    enabled: false
    params_file:
      - "/ws/config/ros2_controllers.yaml"

  joint_state_broadcaster_spawner:
    enabled: false
    controller_name: joint_state_broadcaster
    controller_manager: /controller_manager

  mecanum_controller_spawner:
    enabled: false
    controller_name: mecanum_controller
    controller_manager: /controller_manager

  robot_state_publisher:
    enabled: true
    parameters:
      publish_robot_description: true
      robot_description: "$(xacro /ws/config/rocker.urdf)"

  robot_localization:
    enabled: false
    params_file: "/ws/config/robot_localization.yaml"

  initial_pose_publisher:
    enabled: false
    x: 0.1524
    y: 0.1524
    yaw: 1.5707963268
    frame_id: map
    topic: initialpose
    delay_sec: 0.0
    tf_publish: false
    tf_parent_frame: map
    tf_child_frame: base_link

  nav2_lifecycle_manager:
    enabled: false
    params_file: "/ws/config/lifecycle_localization.yaml"

  imu_calibration:
    enabled: false
    params_file: "/ws/config/imu_calibration.yaml"

  nav2_map_server:
    enabled: true
    params_file: "/ws/config/nav2_map_server.yaml"

  nav2_lifecycle_manager:
    enabled: true
    params_file: "/ws/config/lifecycle_localization.yaml"
